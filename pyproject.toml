[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nju-code-agent"
version = "0.1.0"
description = "A lightweight coding agent for Python algorithm problems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.75.5,!=1.82.7,!=1.82.8",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "pytest>=8.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
code-agent = "code_agent.run.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
code_agent = ["config/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
